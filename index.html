<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="오늘의 날씨와 하루를 채워줄 명언을 확인해 보세요."
    />
    <meta name="theme-color" content="#f5f7fb" />
    <title>오늘의 하늘 — 날씨와 명언</title>
    <link rel="preconnect" href="https://api.open-meteo.com" />
    <link rel="preconnect" href="https://geocoding-api.open-meteo.com" />
    <link rel="preconnect" href="https://korean-advice-open-api.vercel.app" />
    <link rel="stylesheet" href="styles.css?v=4" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="오늘의 하늘 홈">
          <span class="brand-mark" aria-hidden="true">☀</span>
          <span>오늘의 하늘</span>
        </a>
        <p class="topbar-note">날씨와 함께 시작하는 좋은 하루</p>
      </header>

      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow" id="today-date">오늘도 좋은 하루 보내세요</p>
        <h1 id="page-title">오늘을 여는<br /><span>한 문장</span></h1>
      </section>

      <section class="quote-card" aria-labelledby="quote-heading">
        <div class="quote-heading-row">
          <div>
            <p class="eyebrow">A THOUGHT FOR TODAY</p>
            <h2 id="quote-heading">오늘의 한마디</h2>
          </div>
          <span class="quote-mark" aria-hidden="true">“</span>
        </div>
        <div id="quote-content" class="quote-content" aria-live="polite">
          <div class="quote-loading">
            <span class="loading-spinner" aria-hidden="true"></span>
            <p>오늘의 문장을 찾고 있어요</p>
          </div>
        </div>
        <p class="quote-source">매일 새로운 영감을 전해드려요</p>
      </section>

      <section class="weather-card" aria-labelledby="weather-heading">
        <div class="weather-topline">
          <div class="location">
            <span class="location-pin" aria-hidden="true">⌖</span>
            <h2 id="weather-heading">서울</h2>
            <span class="country-label">대한민국</span>
          </div>
          <button class="location-button" id="location-button" type="button">
            <span aria-hidden="true">◎</span> 내 위치
          </button>
        </div>

        <div class="weather-main" id="weather-content" aria-live="polite">
          <div class="weather-loading">
            <span class="loading-spinner" aria-hidden="true"></span>
            <p>날씨를 불러오고 있어요</p>
          </div>
        </div>

        <form class="city-search" id="city-form">
          <label class="sr-only" for="city-input">도시 이름</label>
          <input
            id="city-input"
            name="city"
            type="search"
            placeholder="다른 도시 검색"
            autocomplete="off"
          />
          <button type="submit" aria-label="도시 검색">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="10.8" cy="10.8" r="6.3"></circle>
              <path d="m15.4 15.4 4.1 4.1"></path>
            </svg>
          </button>
        </form>
        <div class="city-results" id="city-results" aria-live="polite"></div>
      </section>

      <footer class="footer">
        <p>좋은 하루는 작은 순간에서 시작돼요.</p>
        <p class="credit">날씨 <span>Open-Meteo</span> · 명언 <span>한국어 명언 API</span></p>
      </footer>
    </main>
  </body>
</html>
